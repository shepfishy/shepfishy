<svg fill="none" viewBox="0 0 600 0" width="100%" height="0" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .project-card {
          transition: all 0.3s ease;
          border-radius: 6px;
          margin: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .project-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 10px 25px rgba(38, 176, 247, 0.3);
        }
      </style>
    </div>
  </foreignObject>
</svg>