<svg fill="none" viewBox="0 0 600 150" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
      <style>
        .container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 90%;
          max-width: 500px;
          height: 140px;
          background: linear-gradient(-45deg, #6e45e1, #1da1f2, #089de3, #8a2be2, #4f46e5);
          background-size: 400% 400%;
          animation: gradient 15s ease infinite;
          border-radius: 12px;
          box-shadow: 0 8px 16px rgba(0,0,0,0.3);
          overflow: hidden;
          position: relative;
          margin: 0 auto;
        }
        
        /* Add floating particles effect */
        .container::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: radial-gradient(circle at 10% 20%, rgba(255,255,255,0.1) 0%, transparent 20%),
                      radial-gradient(circle at 70% 75%, rgba(255,255,255,0.08) 0%, transparent 20%),
                      radial-gradient(circle at 30% 60%, rgba(255,255,255,0.08) 0%, transparent 15%);
        }
        
        h1 {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          color: white;
          font-size: 3rem;
          font-weight: 700;
          letter-spacing: 1px;
          text-shadow: 0 3px 6px rgba(0,0,0,0.3);
          margin: 0;
          padding: 20px 0;
          animation: fadeIn 1.5s ease-out;
          text-align: center;
          width: 100%;
        }
        
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
      </style>
      <div class="container">
        <h1>Haii I'm shepfish</h1>
      </div>
    </div>
  </foreignObject>
</svg>